name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test SSH
        run: |
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -v -T 10 -p 22 93.84.119.244

      - name: Deploy
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='.next/cache' \
            -e "ssh -i ~/.ssh/deploy_key -p 22" \
            ./ district@93.84.119.244:/var/www/district/data/www/district-school.by/

      - name: Restart application
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 district@93.84.119.244 \
            'cd /var/www/district/data/www/district-school.by && npm install --omit=dev && pm2 restart "district-school.by"'
