name: Deploy to district-school.by

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create deployment archive
        run: |
          rm -rf deploy deploy.zip
          mkdir deploy

          cp -r .next deploy/.next
          cp -r public deploy/public

          cp package.json deploy/
          cp package-lock.json deploy/

          cp next.config.* deploy/ 2>/dev/null || true
          cp postcss.config.* deploy/ 2>/dev/null || true

          cd deploy
          zip -r ../deploy.zip . -x ".next/cache/*"

      - name: Upload deployment archive
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --ftp-pasv \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file deploy.zip \
            "ftp://$FTP_SERVER/www/district-school.by/deploy.zip"