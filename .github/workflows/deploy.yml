name: Deploy to district-school.by

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create deployment archive
        run: |
          rm -rf deploy deploy.zip
          mkdir deploy

          cp -r .next deploy/.next
          cp -r public deploy/public

          cp package.json deploy/
          cp package-lock.json deploy/

          cp next.config.* deploy/ 2>/dev/null || true
          cp postcss.config.* deploy/ 2>/dev/null || true

          if [ -f proxy.ts ]; then
            cp proxy.ts deploy/
          fi

          if [ -f middleware.ts ]; then
            cp middleware.ts deploy/
          fi

          if [ -d src ]; then
            cp -r src deploy/src
          fi

          if [ -d sanity ]; then
            cp -r sanity deploy/sanity
          fi

          cd deploy
          zip -r ../deploy.zip . -x ".next/cache/*"

      - name: Upload deployment archive
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /www/district-school.by/
          exclude: |
            **/*
            !deploy.zip

      - name: Create restart trigger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: .github/deploy-trigger/
          server-dir: /www/district-school.by/.deploy/
